name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Run game tests on a dedicated server
        run: ./gradlew runGameTestServer --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: hermodoors-jar
          path: build/libs/*.jar
          if-no-files-found: error

  # Starts the real client under a virtual display, walks through the passport, every panel stage and both
  # doors opening, and uploads the screenshots. Informational: a broken virtual display should not block merges.
  client-tour:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Run the client screenshot tour
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: timeout 1200 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runTourClient --stacktrace

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-screenshots
          path: |
            run/screenshots/
            run/logs/latest.log
          if-no-files-found: warn
