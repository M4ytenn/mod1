name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Run game tests on a dedicated server
        run: ./gradlew runGameTestServer --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: hermodoors-jar
          path: build/libs/*.jar
          if-no-files-found: error

  # Starts the real client under a virtual display, walks through the passport, every panel stage and both
  # doors opening, and uploads the screenshots. Informational: a broken virtual display should not block merges.
  client-tour:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Run the client screenshot tour
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: timeout 1200 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runTourClient --stacktrace

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-screenshots
          path: |
            run/screenshots/
            run/logs/latest.log
          if-no-files-found: warn

      # For reviewing the art without downloading artifacts: only for commits whose message contains [screenshots].
      - name: Print screenshots into the log
        if: always() && contains(github.event.head_commit.message, '[screenshots]')
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import base64, glob, io, os
          from PIL import Image
          for path in sorted(glob.glob('run/screenshots/*.png')):
              name = os.path.basename(path)
              im = Image.open(path).convert('RGB')
              out = io.BytesIO()
              if any(k in name for k in ('passport', 'power', 'pump', 'clamps', 'wheel')):
                  # GUI shots: undo the integer GUI scale (3 at 1280x720) and keep the middle.
                  w3, h3 = im.width // 3 * 3, im.height // 3 * 3
                  small = im.crop((0, 0, w3, h3)).resize((w3 // 3, h3 // 3), Image.NEAREST)
                  cx, cy = small.width // 2, small.height // 2
                  small.crop((cx - 140, cy - 100, cx + 140, cy + 100)).save(out, 'PNG', optimize=True)
              else:
                  im.resize((640, 360), Image.LANCZOS).save(out, 'JPEG', quality=82)
              data = base64.b64encode(out.getvalue()).decode()
              print(f'TOURFILE {name} {len(data)}')
              for i in range(0, len(data), 76):
                  print(data[i:i + 76])
              print('TOUREND')
          PY
